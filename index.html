<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Aircraft AR Tracker</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    /* --------------------------------------------------------
       UI LAYER
       Fixed overlay above the canvas.
       pointer-events: none on the container means all taps
       pass through to the canvas underneath — EXCEPT on the
       buttons themselves which have pointer-events: auto.
    -------------------------------------------------------- */
    #ui {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      font-family: Arial, sans-serif;
    }

    #controls {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: auto;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      min-width: 140px;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    #startBtn {
      background: #00cc66;
      color: white;
    }

    #calibrateBtn {
      background: #FFD700;
      color: #1a1a1a;
    }

    #cancelCalibBtn {
      background: #ff4444;
      color: white;
      /* Hidden by default — shown when calibration mode is active.
         render.js controls visibility via #calibStatus text,
         but you can also toggle this with JS if you want. */
      display: none;
    }

    #calibStatus {
      margin-top: 4px;
      font-size: 13px;
      color: white;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      min-height: 18px;
    }
  </style>
</head>
<body>

  <!-- Camera feed + AR canvas -->
  <div class="container">
    <video id="camera" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- UI layer — sits above canvas, passes taps through to canvas -->
  <div id="ui">
    <div id="controls">
      <button class="btn" id="startBtn">▶ Start AR</button>
      <button class="btn" id="calibrateBtn">⊕ Calibrate</button>
      <button class="btn" id="cancelCalibBtn">✕ Cancel</button>
      <div id="calibStatus"></div>
    </div>
  </div>

  <script type="module" src="scripts/main.js"></script>
</body>
</html>
